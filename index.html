<script>
/* Fit to the phone screen even if Chrome's "Desktop site" is switched on
   (that mode lays pages out 980px wide and shrinks them, leaving side gaps). */
(function(){
  function fit(){ try{
    var d=document.documentElement, sw=screen.width, w=window.innerWidth;
    var touch=('ontouchstart' in window)||navigator.maxTouchPoints>0;
    d.style.zoom='';
    if(touch&&sw>0&&sw<700&&w>sw*1.25) d.style.zoom=(w/sw).toFixed(3);
  }catch(e){} }
  fit(); window.addEventListener('orientationchange',function(){ setTimeout(fit,300); });
})();
</script>

<body>

<div class="app" id="app"></div>

<script>
/* ============================================================
   Petty Cash core logic — Suba Valli Vilas Jewellery
   Shared by the browser prototype and the Google Apps Script
   backend, so both apply exactly the same rules.
   Data shape: { settings:{...}, days:[...], vouchers:[...] }
   ============================================================ */
var PC = (function () {
  'use strict';

  var DEFAULT_SETTINGS = {
    storeName: 'Suba Valli Vilas Jewellery',
    imprest: 20000,
    cashiers: ['Cashier 1', 'Cashier 2'],
    heads: [
      'Refreshments (Tea / Snacks)',
      'Conveyance / Local Travel',
      'Courier & Postage',
      'Stationery & Printing',
      'Cleaning & Housekeeping',
      'Repairs & Maintenance',
      'Pooja & Festival',
      'Staff Welfare',
      'Miscellaneous'
    ],
    advanceDays: 2,          // an advance older than this is flagged overdue
    payeeCashLimit: 10000    // cash to one payee in one day (Sec 40A(3))
  };

  var DENOMS = [500, 200, 100, 50, 20, 10];

  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function emptyData() { return { settings: clone(DEFAULT_SETTINGS), days: [], vouchers: [] }; }

  function num(x) {
    if (x === '' || x === null || x === undefined) return 0;
    var n = Number(String(x).replace(/,/g, ''));
    return isFinite(n) ? Math.round(n * 100) / 100 : NaN;
  }
  function r2(n) { return Math.round(n * 100) / 100; }
  function str(x) { return (x === null || x === undefined) ? '' : String(x).trim(); }
  function fail(msg) { throw new Error(msg); }
  function inr(n) {
    n = num(n);
    var neg = n < 0; n = Math.abs(n);
    var s = n.toFixed(2).replace(/\.00$/, '');
    var parts = s.split('.'), x = parts[0];
    var last3 = x.slice(-3), rest = x.slice(0, -3);
    if (rest) last3 = ',' + last3;
    rest = rest.replace(/\B(?=(\d{2})+(?!\d))/g, ',');
    return (neg ? '-' : '') + '₹' + rest + last3 + (parts[1] ? '.' + parts[1] : '');
  }
  function daysBetween(a, b) {
    var da = Date.UTC(+a.slice(0, 4), +a.slice(5, 7) - 1, +a.slice(8, 10));
    var db = Date.UTC(+b.slice(0, 4), +b.slice(5, 7) - 1, +b.slice(8, 10));
    return Math.round((db - da) / 86400000);
  }

  /* ---------- lookups ---------- */
  function sortedDays(data) {
    return data.days.slice().sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
  }
  function findDay(data, date) {
    for (var i = 0; i < data.days.length; i++) if (data.days[i].date === date) return data.days[i];
    return null;
  }
  function openDay(data) {
    for (var i = 0; i < data.days.length; i++) if (data.days[i].status === 'Open') return data.days[i];
    return null;
  }
  function lastClosedDay(data) {
    var d = sortedDays(data).filter(function (x) { return x.status === 'Closed'; });
    return d.length ? d[d.length - 1] : null;
  }
  function findVoucher(data, no) {
    no = normNo(no);
    for (var i = 0; i < data.vouchers.length; i++) if (String(data.vouchers[i].voucherNo) === no) return data.vouchers[i];
    return null;
  }
  function normNo(no) {
    var s = str(no);
    if (!/^\d+$/.test(s)) return s;
    return String(parseInt(s, 10));
  }

  /* ---------- cash arithmetic ---------- */
  // Cash movements that happened on a given date.
  function movements(data, date) {
    var m = { payments: 0, advances: 0, refunds: 0, extras: 0, nPay: 0, nAdv: 0, nSettled: 0, nCancelled: 0 };
    data.vouchers.forEach(function (v) {
      if (v.status === 'Cancelled') { if (v.date === date) m.nCancelled++; return; }
      if (v.date === date) {
        if (v.type === 'Payment') { m.payments += num(v.amount); m.nPay++; }
        else { m.advances += num(v.amount); m.nAdv++; }
      }
      if (v.type === 'Advance' && v.status === 'Settled' && v.settleDate === date) {
        m.refunds += num(v.refund); m.extras += num(v.extraPaid); m.nSettled++;
      }
    });
    ['payments', 'advances', 'refunds', 'extras'].forEach(function (k) { m[k] = r2(m[k]); });
    return m;
  }
  function expectedCash(data, date) {
    var d = findDay(data, date);
    if (!d) return 0;
    var m = movements(data, date);
    return r2(num(d.openingCash) + num(d.topUp) - m.payments - m.advances + m.refunds - m.extras);
  }
  function daySummary(data, date) {
    var d = findDay(data, date);
    if (!d) return null;
    var m = movements(data, date);
    return {
      date: date, status: d.status,
      opening: num(d.openingCash), topUp: num(d.topUp), topUpRef: d.topUpRef,
      payments: m.payments, advances: m.advances, refunds: m.refunds, extras: m.extras,
      nPay: m.nPay, nAdv: m.nAdv, nSettled: m.nSettled, nCancelled: m.nCancelled,
      expected: expectedCash(data, date),
      counted: d.status === 'Closed' ? num(d.countedClose) : null,
      variance: d.status === 'Closed' ? num(d.variance) : null,
      varianceReason: d.varianceReason || '',
      openedBy: d.openedBy, closedBy: d.closedBy
    };
  }

  /* ---------- reports ---------- */
  function openAdvances(data, today) {
    return data.vouchers.filter(function (v) { return v.type === 'Advance' && v.status === 'Advance Open'; })
      .map(function (v) {
        var age = daysBetween(v.date, today);
        return { v: v, age: age, overdue: age > num(data.settings.advanceDays) };
      })
      .sort(function (a, b) { return b.age - a.age; });
  }
  function missingSerials(data) {
    var nums = data.vouchers.map(function (v) { return String(v.voucherNo); })
      .filter(function (s) { return /^\d+$/.test(s); }).map(Number);
    if (nums.length < 2) return [];
    var set = {}; nums.forEach(function (n) { set[n] = 1; });
    var min = Math.min.apply(null, nums), max = Math.max.apply(null, nums), out = [];
    for (var n = min; n <= max && out.length < 200; n++) if (!set[n]) out.push(n);
    return out;
  }
  function nextVoucherNo(data) {
    var nums = data.vouchers.map(function (v) { return String(v.voucherNo); })
      .filter(function (s) { return /^\d+$/.test(s); }).map(Number);
    return nums.length ? Math.max.apply(null, nums) + 1 : null;
  }
  // Expenses are recognised when the money is finally spent:
  // a Payment on its voucher date; an Advance on its settlement date at the actual amount.
  function abstract(data, from, to) {
    var inRange = function (d) { return d && d >= from && d <= to; };
    var days = sortedDays(data).filter(function (d) { return inRange(d.date); })
      .map(function (d) { return daySummary(data, d.date); });
    var heads = {}, total = 0, lines = [];
    data.vouchers.forEach(function (v) {
      if (v.status === 'Cancelled') return;
      if (v.type === 'Payment' && inRange(v.date)) {
        heads[v.head] = r2((heads[v.head] || 0) + num(v.amount)); total += num(v.amount);
        lines.push({ date: v.date, v: v, amount: num(v.amount) });
      }
      if (v.type === 'Advance' && v.status === 'Settled' && inRange(v.settleDate)) {
        heads[v.head] = r2((heads[v.head] || 0) + num(v.actualAmount)); total += num(v.actualAmount);
        lines.push({ date: v.settleDate, v: v, amount: num(v.actualAmount) });
      }
    });
    var register = data.vouchers.filter(function (v) { return inRange(v.date) || inRange(v.settleDate); })
      .sort(function (a, b) { return Number(a.voucherNo) - Number(b.voucherNo); });
    return { days: days, heads: heads, expenseTotal: r2(total), expenseLines: lines, register: register };
  }

  /* ---------- operations (each validates, mutates data, returns what changed) ---------- */
  var ops = {};

  ops.openDay = function (data, p, ctx) {
    var cashier = str(p.cashier); if (!cashier) fail('Select the cashier on duty.');
    var date = ctx.today;
    var cur = openDay(data);
    if (cur) fail(cur.date === date ? 'Today is already open.' : 'The day ' + cur.date + ' is still open. Close it first (Day Close tab).');
    if (findDay(data, date)) fail('Today (' + date + ') has already been opened and closed.');
    var last = sortedDays(data).slice(-1)[0];
    if (last && last.date > date) fail('A later date (' + last.date + ') already exists. Check the device date.');
    var prev = lastClosedDay(data), opening;
    if (prev) opening = num(prev.countedClose);
    else {
      opening = num(p.openingCash);
      if (isNaN(opening) || opening < 0 || str(p.openingCash) === '') fail('Enter the opening cash in the box (first day only).');
    }
    var topUp = num(p.topUp);
    if (isNaN(topUp) || topUp < 0) fail('Top-up must be zero or a positive amount.');
    if (topUp > 0 && !str(p.topUpRef)) fail('Enter the top-up reference (e.g. main cash slip no. or who handed it over).');
    data.days.push({
      date: date, openingCash: opening, topUp: topUp, topUpRef: str(p.topUpRef),
      openedBy: cashier, openedAt: ctx.now, status: 'Open',
      expectedClose: '', countedClose: '', variance: '', varianceReason: '', denoms: '', closedBy: '', closedAt: ''
    });
    return { days: [date] };
  };

  ops.addVoucher = function (data, p, ctx) {
    var day = openDay(data);
    if (!day) fail('Open the day before entering vouchers.');
    var cashier = str(p.cashier); if (!cashier) fail('Select the cashier on duty.');
    var no = normNo(p.voucherNo);
    if (!/^\d+$/.test(no) || no === '0') fail('Voucher number must be the printed serial number (digits only).');
    if (findVoucher(data, no)) fail('Voucher ' + no + ' is already recorded.');

    if (p.cancelled) {

  }

  return '<h3 class="sec">Vouchers today ('+rows.length+')</h3>'+(rows.length?rows.map(function(v){return vcard(v);}).join(''):'<div class="card"><div class="empty">No vouchers yet today.</div></div>');
}

function dl(id,f){ var seen={},o=[]; S.v.vouchers.slice().reverse().forEach(function(v){ var x=String(v[f]||'').trim(); if(x&&!seen[x.toLowerCase()]){ seen[x.toLowerCase()]=1; o.push(x);} }); return '<datalist id="'+id+'">'+o.slice(0,60).map(function(x){return '<option value="'+esc(x)+'">';}).join('')+'</datalist>'; }

/* ----- Advances ----- */
function tAdvances(){
  var D=S.v, list=PC.openAdvances(D,S.today), od=PC.openDay(D);
  if(!list.length) return '<div class="card"><div class="empty">No advances with staff.</div></div>';
  var tot=list.reduce(function(s,a){return s+num(a.v.amount);},0);
  return '<h3 class="sec" style="margin-top:4px">With staff · '+list.length+' · '+inr(tot)+'</h3>'+(isC()&&!od?'<div class="msg warn">Open the day to settle advances.</div>':'')+list.map(function(a){
    var v=a.v, k='set:'+v.voucherNo, age=a.age===0?'Given today':a.age+' day'+(a.age>1?'s':'')+' ago';
    var acts=(a.overdue?'<span class="pill p-od">Overdue · '+age+'</span>':'<span class="hint">'+age+'</span>')+(isC()&&od?'<span style="margin-left:auto"></span><button class="btn sm" data-open="'+k+'">'+(S.open===k?'Close':'Settle')+'</button>':'');
    var inl=S.open===k?'<div class="inl"><label class="f big">Actual spent (₹)<input type="number" min="0" step="1" inputmode="decimal" id="s_a_'+v.voucherNo+'" data-amt="'+esc(v.amount)+'" data-live="1"></label><label class="f">Bill / receipt no.<input type="text" id="s_b_'+v.voucherNo+'"></label><label class="f">Remarks <span class="hint">optional</span><input type="text" id="s_r_'+v.voucherNo+'"></label><div class="msg" id="s_d_'+v.voucherNo+'"></div><div class="msg err" id="s_e_'+v.voucherNo+'"></div><button class="btn block" data-act="settle" data-no="'+v.voucherNo+'">Confirm settlement</button></div>':'';
    return vcard(v,acts,inl);
  }).join('');
}

/* ----- Close ----- */
function tClose(){
  var D=S.v, od=PC.openDay(D);
  if(!od){ var last=PC.lastClosedDay(D); if(!last) return '<div class="card"><div class="empty">No day opened yet.</div></div>';
    var s=PC.daySummary(D,last.date); return '<div class="card"><h2>Last close · '+fd(last.date)+'</h2><div class="kv"><div>Expected</div><div>'+inr(s.expected)+'</div><div>Counted</div><div>'+inr(s.counted)+'</div><div>Variance</div><div class="'+(s.variance?'var-x':'var-0')+'">'+inr(s.variance)+'</div></div>'+(s.varianceReason?'<p class="hint">Reason: '+esc(s.varianceReason)+'</p>':'')+'<p class="hint">Closed by '+esc(last.closedBy)+'.</p>'+
      (S.lastMail&&S.lastMailDate===last.date?'<div class="msg '+(S.lastMail.error||S.lastMail.none?'warn':'ok')+'">'+esc(mailMsg(S.lastMail))+'</div>':'')+
      ((S.v.settings.reportEmails||[]).length?'<button class="btn ghost block" data-act="resend" data-date="'+last.date+'">Email this day\u2019s report again</button>':'')+'</div>'; }
  var exp=PC.expectedCash(D,od.date);
  return '<div class="card"><h2>Close '+fd(od.date)+'</h2>'+posTable(od.date)+'</div>'+
    '<div class="card"><h2>Count the cash</h2>'+PC.DENOMS.map(function(d){return '<div class="den"><span class="lab">₹'+d+'</span><div class="step"><button data-step="'+d+'" data-d="-1" aria-label="Less ₹'+d+'">−</button><input type="number" min="0" step="1" inputmode="numeric" id="den_'+d+'" data-den="'+d+'" placeholder="0"><button data-step="'+d+'" data-d="1" aria-label="More ₹'+d+'">+</button></div><span class="amt" id="den_amt_'+d+'">₹0</span></div>';}).join('')+
    '<div class="den"><span class="lab">Coins</span><input type="number" min="0" step="1" inputmode="decimal" id="den_coins" data-den="coins" placeholder="Total ₹" style="margin:0"><span class="amt" id="den_amt_coins">₹0</span></div></div>'+
    '<div class="sticky-total"><div><div class="hint">Counted</div><div class="n" style="font-size:20px;font-weight:750" id="den_total">₹0</div></div><div style="text-align:right"><div class="hint">vs expected '+inr(exp)+'</div><div class="n" style="font-size:16px;font-weight:700" id="den_var">—</div></div></div>'+
    reportNotice()+'<div class="card"><label class="f">Reason for difference <span class="hint">required if counted ≠ expected</span><textarea id="cl_reason"></textarea></label><label class="chk"><input type="checkbox" id="cl_confirm"> I have counted the petty cash box. Today’s entries will be locked.</label><div class="msg err" id="cl_err"></div><button class="btn block" id="cl_btn">Close day</button></div>';
}

function reportNotice(){
  var to=S.v.settings.reportEmails||[];

    :'<div class="msg warn">No report email is set. To email the day\u2019s report on closing, add one under <b>More \u2192 Daily report email</b>.</div>';
}

  var h='<div class="card"><div class="row2"><label class="f" style="margin:0">From<input type="date" id="ab_from" value="'+S.from+'" data-fresh="1"></label><label class="f" style="margin:0">To<input type="date" id="ab_to" value="'+S.to+'" data-fresh="1"></label></div><button class="btn sm block" id="ab_go" style="margin-top:10px">Show</button></div>';

  h+='<div class="card"><h2>Expenses by head <span class="hint">for Tally</span></h2>'+(hk.length?'<table class="calc">'+hk.map(function(x){return '<tr><td>'+esc(x)+'</td><td>'+inr(A.heads[x])+'</td></tr>';}).join('')+'<tr class="res"><td>Total</td><td>'+inr(A.expenseTotal)+'</td></tr></table>':'<div class="empty">No expenses in range.</div>')+'<p class="hint">Payments count on their date. Advances count when settled, at the actual amount.</p><button class="btn ghost sm" id="ab_head">Copy for Excel</button></div>';
  h+='<h3 class="sec">Day by day</h3>'+(A.days.length?A.days.slice().reverse().map(function(s){return '<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><b>'+fd(s.date)+'</b><span class="chip '+(s.status==='Open'?'open':'closed')+'">'+s.status+'</span></div><div class="kv"><div>Opening</div><div>'+inr(s.opening)+'</div><div>Top-up</div><div>'+inr(s.topUp)+'</div><div>Payments</div><div>'+inr(s.payments)+'</div><div>Advances given</div><div>'+inr(s.advances)+'</div>'+(s.refunds?'<div>Returned</div><div>'+inr(s.refunds)+'</div>':'')+(s.extras?'<div>Extra paid</div><div>'+inr(s.extras)+'</div>':'')+'<div><b>Expected</b></div><div><b>'+inr(s.expected)+'</b></div>'+(s.counted!==null?'<div>Counted</div><div>'+inr(s.counted)+'</div><div>Variance</div><div class="'+(s.variance?'var-x':'var-0')+'">'+inr(s.variance)+'</div>':'')+'</div>'+(s.varianceReason?'<div class="hint" style="margin-top:6px">'+esc(s.varianceReason)+'</div>':'')+'</div>';}).join(''):'<div class="card"><div class="empty">No days in range.</div></div>');
  h+='<div class="card"><h2>Voucher register</h2><div class="scroll"><table class="t"><thead><tr><th>No.</th><th>Date</th><th>Employee</th><th>Purpose</th><th class="r">Amount</th><th>Status</th></tr></thead><tbody>'+A.register.map(function(v){return '<tr><td>'+esc(v.voucherNo)+'</td><td>'+fds(v.date)+'</td><td>'+esc(v.employee)+'</td><td>'+esc(v.purpose)+'</td><td class="r">'+(v.status==='Cancelled'?'—':inr(v.amount))+'</td><td>'+pill(v)+'</td></tr>';}).join('')+'</tbody></table></div><button class="btn ghost sm" id="ab_reg" style="margin-top:10px">Copy register for Excel</button><div id="ab_copybox"></div></div>';

/* ============ live ============ */
function live(){
  var amt=$('#v_amt');
  if(amt){ var od=PC.openDay(S.v); $('#v_avail').textContent=od?'In box '+inr(PC.expectedCash(S.v,od.date)):'';
    $('#v_billhint').textContent=$('#v_adv').checked?'at settlement':'if any';
    var no=$('#v_no').value.trim(), h=$('#v_nohint'), next=PC.nextVoucherNo(S.v);
    if(no&&PC.findVoucher(S.v,no)){ h.textContent='Already entered'; h.style.color='var(--bad)'; }
    else if(no&&next&&/^\d+$/.test(no)&&+no!==next){ h.textContent=+no>next?'Skips '+(+no-next)+' no.':'Out of sequence'; h.style.color='var(--warn)'; }
    else { h.textContent=next?'Next in sequence':''; h.style.color=''; } }
  $$('[data-live]').forEach(settleDiff); updateClose();
}
function settleDiff(i){
  var n=i.id.split('_').pop(), b=$('#s_d_'+n); if(!b) return;
  if(i.value===''){ b.textContent=''; b.className='msg'; return; }
  var d=Math.round((num(i.value)-num(i.dataset.amt))*100)/100;
  if(d<0){ b.textContent='Employee returns '+inr(-d)+' to the box.'; b.className='msg ok'; }
  else if(d>0){ b.textContent='Pay the employee '+inr(d)+' more.'; b.className='msg warn'; }
  else { b.textContent='Exact. No cash changes hands.'; b.className='msg ok'; }
}
function updateClose(){
  var od=S.v&&PC.openDay(S.v); if(!od||!$('#den_total')) return; var t=0;
  PC.DENOMS.forEach(function(d){ var c=num($('#den_'+d).value)||0; $('#den_amt_'+d).textContent=inr(c*d); t+=c*d; });
  var co=num($('#den_coins').value)||0; $('#den_amt_coins').textContent=inr(co); t+=co; $('#den_total').textContent=inr(t);
  var any=$$('[data-den]').some(function(i){return i.value!=='';}), v=Math.round((t-PC.expectedCash(S.v,od.date))*100)/100, el=$('#den_var');
  el.textContent=any?(v===0?'Matches ✓':(v>0?'Excess ':'Short ')+inr(Math.abs(v))):'—'; el.className='n '+(any?(v===0?'var-0':'var-x'):'');
}

/* ============ events ============ */
document.addEventListener('input',function(e){ var id=e.target.id||''; if(id.indexOf('v_')===0){ live(); var lb=$('#v_limit'); if(lb&&id!=='v_no') lb.style.display='none'; } if(e.target.dataset.live) settleDiff(e.target); if(e.target.dataset.den) updateClose(); });
document.addEventListener('change',function(e){ if(e.target.name==='v_type') live(); });
document.addEventListener('keydown',function(e){ if(e.key==='Enter'&&e.target.id==='li_pin'){ var b=$('#li_btn'); if(b) b.click(); } });
document.addEventListener('click',function(e){
  var t=e.target.closest('button'); if(!t) return; var id=t.id, no=t.dataset.no;
  if(id==='pubRetry'){ S.loginErr=''; loadPublic(); return; }
  if(t.dataset.demo){ login(t.dataset.demo,t.dataset.pin,null); return; }
  if(id==='demoNext'){ call('demoNextDay',{}).then(function(r){ if(r.ok&&r.view) S.v=r.view; S.today=r.today||S.today; render(); toast('Moved to the next day (demo)'); }); return; }
  if(id==='demoReset'){ call('demoReset',{}).then(function(){ S.from=null; signOut(''); toast('Demo reset'); }); return; }
  if(id==='li_btn'){ var u=$('#li_user').value; if(!u){ $('#li_err').textContent='Choose your name.'; return; } t.disabled=true; login(u,$('#li_pin').value,t); return; }
  if(id==='su_btn'){ var sp={name:$('#su_name').value,pin:$('#su_pin').value,pin2:$('#su_pin2').value,alsoCashier:$('#su_cash').checked}; t.disabled=true;
    call('setupFirst',sp).then(function(r){ t.disabled=false; if(!r.ok){ $('#su_err').textContent=r.error; return; } login(r.result.userId,sp.pin,null); }); return; }
  if(t.dataset.tab){ S.tab=t.dataset.tab; S.open=null; S.more=null; render(); window.scrollTo(0,0); return; }
  if(t.dataset.more!==undefined){ S.more=t.dataset.more||null; S.open=null; render(); window.scrollTo(0,0); return; }
  if(t.dataset.open){ S.open=S.open===t.dataset.open?null:t.dataset.open; render(); var f=$('.inl input:not([type=checkbox])'); if(f) f.focus(); return; }
  if(t.dataset.step){ var inp=$('#den_'+t.dataset.step); inp.value=Math.max(0,(num(inp.value)||0)+Number(t.dataset.d)); updateClose(); return; }
  if(id==='outBtn') return signOut('');
  if(id==='refreshBtn') return act('getState',{},{btn:t,ok:'Up to date'});
  if(id==='posToggle'){ S.showPos=!S.showPos; render(); return; }
  if(id==='newV'){ S.sheet='voucher'; S.cancelMode=false; render(false); var a=$('#v_amt'); if(a) a.focus(); return; }
  if(id==='sheetClose'){ S.sheet=null; render(false); return; }
  if(id==='cancelToggle'){ S.cancelMode=!S.cancelMode; render(false); return; }
  if(id==='od_btn'){ var p={topUp:$('#od_topup').value,topUpRef:$('#od_ref').value}; if($('#od_opening')) p.openingCash=$('#od_opening').value; return act('openDay',p,{btn:t,err:function(m){$('#od_err').textContent=m;},ok:'Day opened'}); }
  if(id==='v_save'||id==='v_savenext'||id==='v_confirm'){
    var nextMode=id==='v_savenext'||(id==='v_confirm'&&t.dataset.next==='1');
    var p2={voucherNo:$('#v_no').value,type:$('#v_adv').checked?'Advance':'Payment',employee:$('#v_emp').value,payee:$('#v_payee').value,purpose:$('#v_purpose').value,head:$('#v_head').value,amount:$('#v_amt').value,billNo:$('#v_bill').value,approvedBy:$('#v_appr').value,confirmLimit:id==='v_confirm'};
    $('#v_err').textContent='';
    return act('addVoucher',p2,{btn:t,keep:false,before:function(){ if(!nextMode) S.sheet=null; else { var keepAppr=p2.approvedBy; setTimeout(function(){ var a=$('#v_appr'); if(a) a.value=keepAppr; var f=$('#v_amt'); if(f) f.focus(); },0); } },
      ok:'Voucher '+p2.voucherNo+' saved',
      err:function(m){ if(m.indexOf('CONFIRM_LIMIT:')===0){ var lb=$('#v_limit'); lb.innerHTML=esc(m.slice(14))+'<div style="margin-top:8px"><button class="btn sm" id="v_confirm" data-next="'+(nextMode?1:0)+'">Management approved — save anyway</button></div>'; lb.style.display='block'; } else $('#v_err').textContent=m; }});
  }
  if(id==='c_btn') return act('addVoucher',{voucherNo:$('#c_no').value,cancelled:true,purpose:$('#c_reason').value},{btn:t,keep:false,before:function(){S.sheet=null;S.cancelMode=false;},err:function(m){$('#c_err').textContent=m;},ok:'Cancelled voucher recorded'});
  if(t.dataset.act==='settle') return act('settleAdvance',{voucherNo:no,actualAmount:$('#s_a_'+no).value,settleBillNo:$('#s_b_'+no).value,remarks:$('#s_r_'+no).value},{btn:t,before:function(){S.open=null;},err:function(m){$('#s_e_'+no).textContent=m;},ok:'Advance '+no+' settled'});
  if(id==='cl_btn'){ if(!$('#cl_confirm').checked){ $('#cl_err').textContent='Tick the box after counting the cash.'; return; } var den={}; $$('[data-den]').forEach(function(i){den[i.dataset.den]=i.value;});
    var closing=PC.openDay(S.v).date;
    return act('closeDay',{denoms:den,varianceReason:$('#cl_reason').value},{btn:t,keep:false,err:function(m){$('#cl_err').textContent=m;},
      before:function(r){ S.lastMail=(r.result&&r.result.mail)||null; S.lastMailDate=closing; },
      ok:function(r){ var m=mailMsg(r.result&&r.result.mail); setTimeout(function(){ toast('Day closed. '+m,6000); },0); return 'Day closed. '+m; }}); }
  if(id==='rm_save') return act('saveReportEmails',{emails:$('#rm_list').value},{btn:t,err:function(m){$('#rm_err').textContent=m;},ok:'Report email saved'});
  if(id==='rs_send'||t.dataset.act==='resend'){ var dsend=t.dataset.date||$('#rs_date').value; var box=$('#rs_msg');
    if(box){ box.className='msg'; box.textContent='Sending…'; }
    return act('sendDayReport',{date:dsend},{btn:t,before:function(r){ S.lastMail=(r.result&&r.result.mail)||null; S.lastMailDate=dsend; },
      err:function(m){ if(box){ box.className='msg err'; box.textContent=m; } else toast(m,5000); },
      ok:function(r){ var m=mailMsg(r.result&&r.result.mail); setTimeout(function(){ toast(m,6000); },0); return m; }}); }
  if(id==='ab_go'){ S.from=$('#ab_from').value||S.from; S.to=$('#ab_to').value||S.to; if(S.from>S.to){var x=S.from;S.from=S.to;S.to=x;} render(); return; }
  if(id==='ab_reg'||id==='ab_head') return copyCsv(id==='ab_reg');
  if(id==='np_btn'){ var n1=$('#np1').value; return act('changePin',{newPin:n1,newPin2:$('#np2').value},{btn:t,keep:false,before:function(){S.auth.pin=n1;S.more=null;},err:function(m){$('#np_err').textContent=m;},ok:'PIN changed'}); }
  if(id==='s_btn'){ var lines=function(s){return s.split('\n').map(function(x){return x.trim();}).filter(Boolean);};
    return act('saveSettings',{storeName:$('#s_name').value,imprest:$('#s_imp').value,advanceDays:$('#s_ad').value,payeeCashLimit:$('#s_lim').value,heads:lines($('#s_heads').value)},{btn:t,err:function(m){$('#s_err').textContent=m;},ok:'Settings saved'}); }
  if(t.dataset.act==='saveUser'){ var uid=t.dataset.uid, pl={name:$('#uf_n_'+uid).value,pin:$('#uf_p_'+uid).value,cashier:$('#uf_c_'+uid).checked,manager:$('#uf_m_'+uid).checked,active:$('#uf_x_'+uid).checked}; if(uid!=='new') pl.id=uid;
    return act('saveUser',pl,{btn:t,before:function(){S.open=null;},err:function(m){$('#uf_e_'+uid).textContent=m;},ok:uid==='new'?'User added':'User saved'}); }
});
function login(uid,pin,btn){
  S.auth={userId:uid,pin:pin};
  call('getState',{}).then(function(r){
    if(btn) btn.disabled=false;
    if(!r.ok){ S.auth=null; var m=String(r.error).replace(/^SIGNIN:/,''), e=$('#li_err'); if(e) e.textContent=m; else toast(m); return; }
    try{ localStorage.setItem('svv_pc_m_last',uid); }catch(x){}
    S.v=r.view; S.today=r.today; S.loginErr=''; S.tab='today'; render(false);
  });
}
function copyCsv(reg){
  var A=PC.abstract(S.v,S.from,S.to), rows, q=function(x){ x=String(x===null||x===undefined?'':x); return /["\n\t]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x; };
  if(reg){ rows=[['Voucher No','Date','Time','Type','Status','Raised by','Paid to','Purpose','Expense head','Amount','Bill no','Approved by','Cashier','Settle date','Actual','Returned','Extra paid','Settle bill no','Remarks']];
    A.register.forEach(function(v){ rows.push([v.voucherNo,v.date,v.time,v.type,v.status,v.employee,v.payee,v.purpose,v.head,v.status==='Cancelled'?'':v.amount,v.billNo,v.approvedBy,v.cashier,v.settleDate,v.actualAmount,v.refund,v.extraPaid,v.settleBillNo,v.remarks]); }); }
  else { rows=[['Expense head','Amount']]; Object.keys(A.heads).forEach(function(h){rows.push([h,A.heads[h]]);}); rows.push(['Total',A.expenseTotal]); }
  var txt=rows.map(function(r){return r.map(q).join('\t');}).join('\r\n'), box=$('#ab_copybox');
  var show=function(){ box.innerHTML='<div class="msg warn">Copy did not work here. Select the text below and copy it.</div><textarea readonly style="min-height:140px;font:12px monospace">'+esc(txt)+'</textarea>'; var ta=box.querySelector('textarea'); ta.focus(); ta.select(); };
  try{ navigator.clipboard.writeText(txt).then(function(){ box.innerHTML=''; toast('Copied. Paste into Excel or Google Sheets.'); },show); }catch(e){ show(); }
}

/* ============ boot ============ */
(function(){ var bar=document.createElement('div'); bar.id='netbar'; bar.textContent='No internet connection — entries cannot be saved until it is back.';
  bar.style.cssText='display:none;position:fixed;left:0;right:0;top:0;z-index:40;background:#b42318;color:#fff;font-size:14px;font-weight:600;text-align:center;padding:calc(8px + env(safe-area-inset-top)) 12px 8px';
  document.body.appendChild(bar);
  function upd(){ bar.style.display=navigator.onLine===false?'block':'none'; }
  window.addEventListener('offline',upd); window.addEventListener('online',function(){ upd(); if(S.pub&&S.pub.failed) loadPublic(); }); upd(); })();
if(SHELL&&'serviceWorker' in navigator) window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
loadPublic();
if(LIVE) setInterval(function(){
  if(!S.auth||S.sheet||S.open||document.visibilityState!=='visible') return;
  var typing=$$('#app input,#app textarea').some(function(i){return i.type!=='radio'&&i.type!=='checkbox'&&!i.dataset.fresh&&i.value!=='';});
  if(!typing) call('getState',{}).then(function(r){ if(r.ok&&r.view){ S.v=r.view; S.today=r.today; render(); } });
},60000);
})();
</script>
